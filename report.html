<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report an Issue | Civic Fix</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Civic Fix</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report an Issue</a>
            <a href="track.html">Track Issue</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>


    <main>

        <section class="report-section">

            <div class="report-header">
                <h2>Report a Civic Issue</h2>

                <p>
                    Help improve your community by reporting
                    a civic problem.
                </p>
            </div>


            <div class="form-card">

                <h3>Select the issue category</h3>

                <p class="form-description">
                    Choose the category that best describes
                    the civic problem.
                </p>


                <div class="category-grid">

                    <button class="category-card">
                        <strong>Road & Transportation</strong>
                        <span>Roads, potholes, traffic and footpaths</span>
                    </button>

                    <button class="category-card">
                        <strong>Water & Sanitation</strong>
                        <span>Water supply, drainage and sewage</span>
                    </button>

                    <button class="category-card">
                        <strong>Waste Management</strong>
                        <span>Garbage collection and waste disposal</span>
                    </button>

                    <button class="category-card">
                        <strong>Electricity & Utilities</strong>
                        <span>Streetlights, poles and electrical issues</span>
                    </button>

                    <button class="category-card">
                        <strong>Public Infrastructure</strong>
                        <span>Public buildings, parks and facilities</span>
                    </button>

                    <button class="category-card">
                        <strong>Environment</strong>
                        <span>Pollution, trees and environmental issues</span>
                    </button>

                    <button class="category-card">
                        <strong>Public Safety</strong>
                        <span>Hazards and unsafe public areas</span>
                    </button>

                    <button class="category-card">
                        <strong>Public Health</strong>
                        <span>Hygiene and health-related civic issues</span>
                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 Civic Fix | Building Better Communities</p>
    </footer>


    <script src="js/report.js"></script>

</body>
</html>
